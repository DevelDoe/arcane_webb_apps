[package]
name = "arcane_webb_apps_backend"
version = "0.2.2"
description = "Arcane Web Apps desktop application"
edition = "2021"

[lib]
name = "app_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

[[bin]]
name = "arcane-web-apps"
path = "src/main.rs"
