name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-22.04
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true

      - name: Cache Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-v2-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            tauri-cli-v2-${{ runner.os }}-

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --locked --version "^2.0.0"

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./backend/tauri.conf.json').version")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app (Windows NSIS)
        if: matrix.platform == 'windows'
        run: cargo tauri build --bundles nsis
        working-directory: backend

      - name: Build Tauri app (macOS DMG)
        if: matrix.platform == 'macos'
        run: cargo tauri build --bundles dmg
        working-directory: backend

      - name: Build Tauri app (Linux AppImage)
        if: matrix.platform == 'linux'
        run: cargo tauri build --bundles appimage
        working-directory: backend

      - name: Collect artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          VERSION="${{ steps.meta.outputs.version }}"

          case "${{ matrix.platform }}" in
            windows)
              ARTIFACT="$(ls -1 backend/target/release/bundle/nsis/*.exe | head -n 1 || true)"
              BUNDLE_NAME="Arcane-Webb-Apps-${VERSION}-windows-setup.exe"
              ;;
            macos)
              ARTIFACT="$(ls -1 backend/target/release/bundle/dmg/*.dmg | head -n 1 || true)"
              BUNDLE_NAME="Arcane-Webb-Apps-${VERSION}-macos.dmg"
              ;;
            linux)
              ARTIFACT="$(ls -1 backend/target/release/bundle/appimage/*.AppImage | head -n 1 || true)"
              BUNDLE_NAME="Arcane-Webb-Apps-${VERSION}-linux.AppImage"
              ;;
            *)
              echo "::error::Unsupported platform"
              exit 1
              ;;
          esac

          if [[ -z "${ARTIFACT}" ]] || [[ ! -f "${ARTIFACT}" ]]; then
            echo "::error::No artifact found for ${{ matrix.platform }}"
            exit 1
          fi

          cp "${ARTIFACT}" "upload/${BUNDLE_NAME}"
          ls -la upload

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: arcane-webb-apps-${{ matrix.platform }}-${{ steps.meta.outputs.version }}
          path: upload/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: arcane-webb-apps-*
          merge-multiple: true

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PRERELEASE=false
          if [[ "${GITHUB_REF_NAME}" == *"-beta"* ]]; then
            PRERELEASE=true
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          name: Arcane Webb Apps v${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## Install

            | Platform | File |
            |----------|------|
            | **Windows** | `Arcane-Webb-Apps-*-windows-setup.exe` |
            | **macOS** | `Arcane-Webb-Apps-*-macos.dmg` |
            | **Linux** | `Arcane-Webb-Apps-*-linux.AppImage` |

            Builds are unsigned. On Windows, choose **More info → Run anyway** if SmartScreen blocks the installer. On macOS, control-click the app and choose **Open**. On Linux, `chmod +x` the AppImage, then run it.
          files: release-assets/*
